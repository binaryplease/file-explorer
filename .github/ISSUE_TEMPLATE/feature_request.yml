name: Feature request
description: Propose something the explorer should do that it does not do yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: this project has a **binding responsiveness principle**,
        and it rules out the obvious implementation of most good ideas.

        > The core navigation loop — list, fuzzy-search, move — always comes
        > first. Every feature beyond it must be async and non-blocking. A
        > listing or search response never waits on enrichment work (git status,
        > previews, directory sizes, thumbnails, …). Enrichment arrives after the
        > tree has painted, is cancellable when the user navigates away, and
        > degrades to absent rather than delaying the core. **If a feature cannot
        > be built this way, it does not ship.**

        Features visible in other explorers — git status, directory sizes, a verb
        palette — are welcome proposals. The version of them that blocks a
        listing is not.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        The task, not the feature. "I want to find the three biggest directories
        under a checkout" is more useful than "add directory sizes", because it
        leaves room for an answer nobody thought of.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: Include the keyboard interaction if there is one, and how it behaves while it is still loading.
    validations:
      required: true

  - type: textarea
    id: responsiveness
    attributes:
      label: How it stays off the navigation path
      description: |
        Where does the work happen, what does the user see before it finishes,
        and what happens if they navigate away mid-flight? "I don't know" is an
        acceptable answer — say that rather than guessing.
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: |
        Does `broot`, `ranger`, `nnn`, `yazi` or a GUI file manager already do
        this? Say which, and where it differs from what you want.
    validations:
      required: false

  - type: checkboxes
    id: checked-docs
    attributes:
      label: Before you file
      options:
        - label: I checked `docs/Requirements.md` — this is not already a planned or in-progress requirement.
          required: true
        - label: I checked `docs/Decisions.md` — this was not already considered and rejected.
          required: true
