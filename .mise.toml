[tools]
bun = "1"

[env]
PORT = "3000"
NODE_ENV = "development"

# The zink instance this explorer publishes to (ADR: publish-to-zink feature).
# `POST <ZINK_BASE_URL>/api/upload` with the `x-deploy-key` header. Leave the
# key empty against an open-mode zink; set it when the operator gated uploads.
ZINK_BASE_URL = "http://localhost:3000"
# ZINK_DEPLOY_KEY = ""

# Directory served by the explorer. Defaults to the home directory of the user
# running the server; a positional CLI argument to the server wins over this.
# EXPLORER_ROOT = "/path/to/serve"

[tasks.dev]
description = "Start dev servers (Elysia + Vite) concurrently"
run = 'bunx concurrently -k -n server,client "bun --watch server/index.ts" "bunx vite"'

[tasks."dev:server"]
description = "Start Elysia server in watch mode"
run = "bun --watch server/index.ts"

[tasks."dev:client"]
description = "Start Vite dev server"
run = "bunx vite"

[tasks.build]
description = "Build client (Vite) and server (Bun)"
run = """
bunx vite build
NODE_ENV=production bun build server/index.ts --outdir dist/server --target bun --sourcemap=linked --production
"""

[tasks.start]
description = "Start production server"
run = "NODE_ENV=production bun dist/server/index.js"

[tasks.typecheck]
description = "Type-check all TypeScript"
run = "bunx tsc --noEmit"
