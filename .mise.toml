[tools]
bun = "1"

[env]
PORT = "3000"
NODE_ENV = "development"

# Directory served by the explorer. Dev serves this repo — you are almost always
# looking at the code you are changing, and it makes the tree the same for every
# contributor instead of "whatever is in my home directory". `{{config_root}}`
# is where this file lives, so it holds from any cwd. Point it elsewhere to
# browse another location; a positional argument to the server still wins over
# it, and the `bfe` CLI ignores it entirely (it serves its own cwd). Unset, the
# server's own default is the home directory of the user running it.
EXPLORER_ROOT = "{{config_root}}"

# Whether the served root is a real boundary or just the tree's starting anchor.
# Off by default: this is a local-only loopback tool running with the user's own
# filesystem privileges, and the default root is the home directory, so
# confining to it protects nothing that matters. Turn it on for a genuinely
# hosted surface, together with an EXPLORER_ROOT worth confining to.
# EXPLORER_CONFINE = "true"

# Log one line per directory listing with its phase timings and syscall counts
# — the per-listing server timing the optimization gate in
# docs/requirements/101-performance-budgets.md requires. Off by default: a local
# browsing tool that printed a line per keystroke-driven listing would be
# unusable. The same numbers ride on every listing's Server-Timing response
# header regardless, so this is only for watching a terminal instead of devtools.
# EXPLORER_TIMING = "true"

# Extra Host header values to answer for, beyond loopback names. Empty means
# loopback only, which is what closes DNS rebinding — see the security model in
# README.md. Only needed for a HOST=0.0.0.0-behind-Caddy deployment — and there
# it is mandatory: a non-loopback HOST with this unset is a fatal startup error,
# because binding off loopback publishes an unauthenticated filesystem API.
# EXPLORER_ALLOWED_HOSTS = "files.example.com"

# Exact browser Origins granted cross-origin (CORS) read access. Empty (the
# default) means no CORS headers at all — the historical, most-restrictive
# posture, relying on the same-origin policy to guard responses. Set it only for
# the deliberate embedding seam, where a host app mounts this frontend into its
# own page while running this server as a separate process on another port:
# naming that host's Origin here returns CORS headers for it, and nothing else. The loopback bind and Host-header guard are untouched.
# EXPLORER_ALLOWED_ORIGINS = "http://localhost:5175"

[tasks.dev]
description = "Resolve free ports, then start dev servers (Elysia + Vite)"
run = "bun scripts/dev.ts"

[tasks."dev:ports"]
description = "Probe the canonical dev ports and report the assignment"
run = "bun scripts/dev-ports.ts"

[tasks."dev:server"]
description = "Start Elysia server in watch mode"
run = "bun --watch server/index.ts"

[tasks."dev:client"]
description = "Start Vite dev server"
run = "bunx vite"

[tasks.build]
description = "Build client (Vite) and server + CLI (Bun)"
run = """
bunx vite build
NODE_ENV=production bun build server/index.ts server/cli.ts --outdir dist/server --target bun --sourcemap=linked --production
"""

[tasks.start]
description = "Start production server"
run = "NODE_ENV=production bun dist/server/index.js"

[tasks.cli]
description = "Run the explorer CLI (bfe) from source"
run = "bun server/cli.ts"

[tasks."stress:fixture"]
description = "Generate the large-directory stress fixture (the gate every perf claim passes)"
run = "bun scripts/stress-fixture.ts"

[tasks."bench:list"]
description = "Measure GET /api/fs/list against the stress fixture, against its budget"
run = "bun scripts/bench-listing.ts"

[tasks.typecheck]
description = "Type-check all TypeScript"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run unit tests (bun test)"
run = "bun test"

[tasks."deps:hash"]
description = "Refresh the vendored-dependency hash in flake.nix (run after any dependency change)"
run = "{{config_root}}/update-deps-hash.sh"
