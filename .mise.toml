[tools]
bun = "1"

[env]
PORT = "3000"
NODE_ENV = "development"

# Directory served by the explorer. Defaults to the home directory of the user
# running the server; a positional CLI argument to the server wins over this.
# EXPLORER_ROOT = "/path/to/serve"

# Whether the served root is a real boundary or just the tree's starting anchor.
# Off by default: this is a local-only loopback tool running with the user's own
# filesystem privileges, and the default root is the home directory, so
# confining to it protects nothing that matters. Turn it on for a genuinely
# hosted surface, together with an EXPLORER_ROOT worth confining to.
# EXPLORER_CONFINE = "true"

# Extra Host header values to answer for, beyond loopback names. Empty means
# loopback only, which is what closes DNS rebinding — see the security model in
# README.md. Only needed for a HOST=0.0.0.0-behind-Caddy deployment.
# EXPLORER_ALLOWED_HOSTS = "files.example.com"

[tasks.dev]
description = "Resolve free ports, then start dev servers (Elysia + Vite)"
run = "bun scripts/dev.ts"

[tasks."dev:ports"]
description = "Probe the canonical dev ports and report the assignment"
run = "bun scripts/dev-ports.ts"

[tasks."dev:server"]
description = "Start Elysia server in watch mode"
run = "bun --watch server/index.ts"

[tasks."dev:client"]
description = "Start Vite dev server"
run = "bunx vite"

[tasks.build]
description = "Build client (Vite) and server (Bun)"
run = """
bunx vite build
NODE_ENV=production bun build server/index.ts --outdir dist/server --target bun --sourcemap=linked --production
"""

[tasks.start]
description = "Start production server"
run = "NODE_ENV=production bun dist/server/index.js"

[tasks.typecheck]
description = "Type-check all TypeScript"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run unit tests (bun test)"
run = "bun test"
