<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="binp-file-explorer">
  <title>binp-file-explorer</title>
  <!-- The mark is a boar, face on. A boar roots: it digs through the grove
       floor with its snout until it finds the one thing it was after, which is
       what this explorer does to a tree. The snout is the focal shape and the
       only colour, in color-match amber, the colour a real listing uses for a
       search hit. It is also a nod to the lineage: the terminal explorer this
       one is modelled on is fronted by a hand-drawn cow, and a farm animal is
       the family joke, told with a different animal.

       No tile. The head is ink on light browser chrome and cream on dark
       chrome, swapped by the prefers-color-scheme rule in the style block
       below, which Chromium and Firefox honour for SVG favicons. Eyes and
       tusks are holes in the head path rather than painted highlights, so they
       show whatever the tab strip is and contrast with the head in both
       schemes. The nostrils stay ink in both schemes because they sit on
       amber, where ink measures 13.2:1.

       Built to survive the worst context first. At a 16px tab the silhouette
       is a wide head with a spiked crest and a 7 by 5 amber block; the crest
       is what keeps it a boar rather than a pig, so it is oversized on
       purpose. Verified at 16, 32 and 128px on light and dark chrome, and in
       a single colour with the snout knocked out. The raster fallbacks in
       this directory cannot swap colour and carry the ink head. -->
  <style>.head{fill:#1b2130}@media (prefers-color-scheme:dark){.head{fill:#e8ecf3}}</style>
  <path class="head" fill-rule="evenodd" d="M3 2L10 7Q16 5 22 7L29 2Q31 15 27 23Q23 30 16 30Q9 30 5 23Q1 15 3 2ZM11 6.5l2-5 1.5 5zM14.4 6.2L16 .5l1.6 5.7zM17.5 6.5l1.5-5 2 5zM10.5 11.7a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 1 0 0-3.8ZM21.5 11.7a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 1 0 0-3.8ZM7.6 28C5.2 25.6 4.6 22 6 18.2L9.2 20.6C8.2 22.6 8.3 25 9.2 27.2ZM24.4 28c2.4-2.4 3-6 1.6-9.8l-3.2 2.4c1 2 .9 4.4 0 6.6Z"/>
  <rect x="9" y="18" width="14" height="9.5" rx="4.5" fill="#ffd16b"/>
  <ellipse cx="13.2" cy="22.8" rx="1.6" ry="2.1" fill="#1b2130"/>
  <ellipse cx="18.8" cy="22.8" rx="1.6" ry="2.1" fill="#1b2130"/>
</svg>
