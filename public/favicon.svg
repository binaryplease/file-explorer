<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="binp-file-explorer">
  <title>binp-file-explorer</title>
  <!-- The mark is the broot loop drawn as one gesture: the tree connectors the
       explorer prints on every row, stepping down and to the right into the
       tree, and ending on the block cursor sitting on the found row. Two steps
       of guide line and last-child connector, then the cursor. Read fast it is
       a staircase going down; read slowly it is a listing you have just
       descended and the item you landed on.

       Colours are grove tokens, not new values (src/theme.css, custom
       properties named here without their leading hyphens because an XML
       comment may not contain that pair). The tile is the light-theme
       color-dir blue, the same blue a directory is named in; the stairs are the
       light-theme color-chrome cream; the cursor is color-match amber, the
       colour a real listing uses for a search hit. Cream on the tile measures
       5.6:1 and the amber block is also the heaviest shape, so the emphasis
       survives greyscale and a single colour without the tile.

       Built to survive the worst context first. Geometry is on a 32-unit grid
       with every stroke edge on an even unit, so at a 16px tab each run of the
       stair is exactly two whole pixels and the cursor is a clean 4 by 5 block.
       Saturated blue holds against both light and dark browser chrome, which
       is where a favicon lives. -->
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <path d="M6 5V12H14V20H20" fill="none" stroke="#f6f8fc" stroke-width="4" stroke-linejoin="miter"/>
  <rect x="20" y="16" width="8" height="10" fill="#ffd16b"/>
</svg>
