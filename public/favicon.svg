<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="binp-file-explorer">
  <title>binp-file-explorer</title>
  <!-- The mark is the core loop drawn as a glyph: a tree guide with two sibling
       rows, and one row nested a level deeper, narrowed to by search and
       carrying the block cursor. Colours are grove tokens, not new values — the
       tile is --color-term, the guide and sibling rows are --color-dir, the
       found row and its cursor are --color-match (src/theme.css). That is the
       same blue/amber pairing a real listing uses for directories and search
       hits, so the icon is a sample of the palette rather than a decoration on
       top of it.

       Built to survive the worst context first. At a 16px tab it holds because
       there are only five strokes on a 7.6-unit row pitch; the found row stays
       distinguishable in greyscale and in one colour because it is also the
       deepest and the longest, so the accent never carries the meaning alone.
       Contrast on the tile is 8.9:1 for the guide and 13.2:1 for the found row.
       Geometry is on a 32-unit grid, optically centred rather than
       bounding-box centred, with round caps and joins throughout. -->
  <rect width="32" height="32" rx="7" fill="#0e1119"/>
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.5 8.4 H7.5 V23.6 H15.3" stroke="#6fb7ff"/>
    <path d="M12.3 8.4 V16 H18.9" stroke="#ffd16b"/>
  </g>
  <rect x="21.9" y="14.1" width="3.8" height="3.8" rx="1.1" fill="#ffd16b"/>
</svg>
